<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111110">
  <title>Receipt Coach</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Receipt Coach</h1>
    <p id="subtitle">Snap receipts. See your habits. Get one better idea a week.</p>
  </header>

  <main>
    <section id="view-add" class="view">
      <div class="card">
        <h2>Add a receipt</h2>
        <p class="muted">The photo is read on this phone. Nothing is uploaded.</p>
        <label class="btn primary" for="photo">Take or choose a photo</label>
        <input id="photo" type="file" accept="image/*" capture="environment" hidden>
        <button id="manual" class="btn">Type it in instead</button>
        <p id="status" class="muted" role="status"></p>
        <p id="month-line" class="muted"></p>
      </div>

      <form id="review" class="card" hidden>
        <h2 id="r-title">Check the details</h2>
        <p class="muted">Fix anything the reader got wrong, then save.</p>
        <label>Store <input id="r-store" required maxlength="40" list="stores" autocomplete="off"></label>
        <label>Date <input id="r-date" type="date" required></label>
        <label class="check"><input id="r-out" type="checkbox"> This was eating out or takeout</label>
        <h3>Items</h3>
        <div id="r-items"></div>
        <button type="button" id="r-add" class="btn small">+ Add item</button>
        <label>Total paid <input id="r-total" type="number" step="0.01" min="0" inputmode="decimal" required></label>
        <p id="r-hint" class="hint" hidden></p>
        <div class="row">
          <button type="submit" class="btn primary">Save receipt</button>
          <button type="button" id="r-cancel" class="btn">Cancel</button>
        </div>
      </form>
      <datalist id="stores"></datalist>
      <datalist id="item-names"></datalist>
    </section>

    <section id="view-dash" class="view" hidden></section>
    <section id="view-insights" class="view" hidden></section>
    <section id="view-shop" class="view" hidden></section>
    <section id="view-list" class="view" hidden></section>
  </main>

  <nav aria-label="Sections">
    <button data-view="add" aria-current="page">Add</button>
    <button data-view="dash">Dashboard</button>
    <button data-view="insights">Insights</button>
    <button data-view="shop">Shopping</button>
    <button data-view="list">Receipts</button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" defer></script>
  <script type="module" src="app.js"></script>
</body>
</html>
